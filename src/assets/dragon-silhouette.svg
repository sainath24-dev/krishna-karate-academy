<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dragonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B1F" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#8C1017" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="dragonGold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#8C1017" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0B0A08" stop-opacity="0.1" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#subtleGlow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Dragon Spine & Body Flow -->
    <path d="M 400 60 C 460 70, 520 110, 530 160 C 540 220, 460 260, 410 270 C 340 280, 270 320, 290 390 C 310 460, 410 470, 460 450 C 530 420, 580 340, 540 280 C 500 220, 390 180, 370 140 C 350 90, 410 60, 450 55"
          stroke="url(#dragonGlow)" stroke-width="2.5" />

    <path d="M 410 80 C 470 100, 505 135, 510 175 C 515 225, 450 250, 395 265 C 325 285, 275 330, 285 385 C 295 435, 360 465, 435 455 C 495 445, 535 390, 520 330 C 500 255, 380 210, 360 160 C 340 110, 385 75, 425 70"
          stroke="url(#dragonGold)" stroke-width="1.5" stroke-dasharray="8 6" />

    <!-- Dragon Head & Jaws -->
    <path d="M 400 60 L 360 40 L 320 45 L 340 60 L 300 65 L 335 80 L 290 95 L 330 105 L 310 120 L 350 115 L 380 135 L 390 105 Z"
          stroke="#C9A24B" stroke-width="2" fill="#141210" fill-opacity="0.4" />
    
    <!-- Dragon Horns / Antlers -->
    <path d="M 370 45 Q 390 15, 430 10 Q 420 25, 400 35" stroke="#FF4B1F" stroke-width="2" />
    <path d="M 385 40 Q 415 20, 450 25 Q 430 35, 410 42" stroke="#C9A24B" stroke-width="1.8" />

    <!-- Whiskers -->
    <path d="M 305 70 Q 230 75, 180 130 Q 150 170, 120 220" stroke="#C9A24B" stroke-width="1.5" opacity="0.85" />
    <path d="M 315 90 Q 250 120, 210 180 Q 190 220, 160 270" stroke="#FF4B1F" stroke-width="1.2" opacity="0.7" />

    <!-- Dragon Eye - Lit Ember -->
    <circle cx="345" cy="65" r="3.5" fill="#FF4B1F" />
    <circle cx="345" cy="65" r="7" stroke="#FF4B1F" stroke-width="1" opacity="0.6" />

    <!-- Claws / Talons -->
    <!-- Front Claw -->
    <g transform="translate(480, 170)">
      <path d="M 0 0 L 40 20 L 55 10 M 40 20 L 60 25 M 40 20 L 50 40" stroke="#C9A24B" stroke-width="2" />
    </g>
    <!-- Mid Claw -->
    <g transform="translate(260, 360)">
      <path d="M 0 0 L -30 30 L -50 25 M -30 30 L -45 45 M -30 30 L -30 55" stroke="#FF4B1F" stroke-width="2" />
    </g>
    <!-- Rear Claw -->
    <g transform="translate(490, 420)">
      <path d="M 0 0 L 35 25 L 50 15 M 35 25 L 55 35 M 35 25 L 40 50" stroke="#C9A24B" stroke-width="2" />
    </g>

    <!-- Scales & Flame Tufts along Spine -->
    <path d="M 440 85 L 450 65 L 460 90 M 480 110 L 505 95 L 495 125 M 520 150 L 550 145 L 530 170 M 500 230 L 525 240 L 490 250 M 430 270 L 440 295 L 415 285 M 340 290 L 330 315 L 320 295 M 280 340 L 255 350 L 275 365 M 340 440 L 345 465 L 365 445 M 420 465 L 435 490 L 445 460 M 520 410 L 550 415 L 525 390 M 555 330 L 585 320 L 550 310"
          stroke="#FF4B1F" stroke-width="1.8" opacity="0.75" />

    <!-- Tail Tufts & Smoke -->
    <path d="M 460 55 Q 520 20, 580 40 Q 640 60, 690 30 Q 660 75, 610 80 Q 560 85, 490 60"
          stroke="url(#dragonGlow)" stroke-width="1.5" fill="none" />
    <path d="M 480 50 Q 550 30, 620 50 Q 670 70, 720 50"
          stroke="#C9A24B" stroke-width="1.2" opacity="0.6" />
  </g>
</svg>
